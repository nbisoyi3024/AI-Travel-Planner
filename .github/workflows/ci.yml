name: Travel AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          
        run: |
          pytest -v
    deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/515003867140/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@gcplatform-495621.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/gcplatform-495621/cloud-run-source-deploy/travel-ai:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            us-central1-docker.pkg.dev/gcplatform-495621/cloud-run-source-deploy/travel-ai:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy travel-ai \
            --image=us-central1-docker.pkg.dev/gcplatform-495621/cloud-run-source-deploy/travel-ai:${{ github.sha }} \
            --region=us-central1 \
            --project=gcplatform-495621 \
            --platform=managed